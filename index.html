<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Rewards</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#080b0f;
    color:#fff;
    display:flex;
    justify-content:center;
  }
  .page{
    width:min(100%,520px);
    min-height:100vh;
    padding:22px 16px 34px;
    background:
      radial-gradient(circle at 50% 18%,rgba(255,166,0,.12),transparent 30%),
      linear-gradient(180deg,#0c1015 0%,#080b0f 100%);
  }
  .top{
    text-align:center;
    margin-bottom:22px;
  }
  .title{
    margin:0;
    font-size:30px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .subtitle{
    margin:7px 0 0;
    color:#aeb4bd;
    font-size:13px;
  }
  .counter{
    margin:16px auto 0;
    width:max-content;
    padding:8px 16px;
    border:1px solid #3a3f46;
    border-radius:999px;
    background:#11151b;
    font-size:13px;
    color:#ddd;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  .reward{
    position:relative;
    aspect-ratio:1/1;
    padding:4px;
    border:2px solid #272c33;
    border-radius:10px;
    background:#11151a;
    cursor:pointer;
    transition:.18s ease;
    overflow:hidden;
  }
  .reward:hover{transform:translateY(-2px);border-color:#555b64}
  .reward.selected{
    border-color:#f6b51b;
    box-shadow:
      0 0 0 1px #f6b51b,
      0 0 18px rgba(246,181,27,.45),
      inset 0 0 14px rgba(246,181,27,.12);
  }
  .reward.selected::after{
    content:"✓";
    position:absolute;
    top:6px;
    right:6px;
    width:25px;
    height:25px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#f6b51b;
    color:#111;
    font-weight:900;
    font-size:15px;
  }
  .reward img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:6px;
  }
  .claim{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:0;
    border-radius:9px;
    background:linear-gradient(180deg,#ffc52b,#e99c00);
    color:#15110a;
    font-size:16px;
    font-weight:900;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 7px 20px rgba(0,0,0,.3);
  }
  .claim:active{transform:translateY(1px)}
  .celebration{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    place-items:center;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(2px);
  }
  .celebration.show{display:grid}
  .popup{
    position:relative;
    width:min(88%,360px);
    padding:30px 22px 24px;
    text-align:center;
    border:2px solid #e9a80c;
    border-radius:14px;
    background:linear-gradient(180deg,#202020,#111);
    box-shadow:0 0 35px rgba(245,176,15,.35);
    animation:popupIn .35s ease-out both;
  }
  .popup .check{
    width:58px;
    height:58px;
    margin:-60px auto 15px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#f3ad0c;
    color:#15110a;
    font-size:30px;
    font-weight:900;
    border:5px solid #171717;
  }
  .popup h2{margin:0 0 9px;font-size:22px}
  .popup p{margin:0;color:#d0d0d0;font-size:14px;line-height:1.5}
  .gift{
    position:fixed;
    top:-70px;
    z-index:60;
    font-size:38px;
    pointer-events:none;
    animation:giftFall .9s cubic-bezier(.2,.75,.35,1) forwards;
  }
  @keyframes giftFall{
    0%{transform:translateY(0) rotate(-20deg) scale(.75);opacity:0}
    12%{opacity:1}
    75%{opacity:1}
    100%{transform:translateY(calc(100vh + 120px)) rotate(260deg) scale(1);opacity:0}
  }
  @keyframes popupIn{
    from{opacity:0;transform:scale(.86) translateY(12px)}
    to{opacity:1;transform:scale(1) translateY(0)}
  }
  .hint{
    text-align:center;
    margin:12px 0 0;
    color:#777e88;
    font-size:11px;
  }
  @media(max-width:380px){
    .page{padding-left:11px;padding-right:11px}
    .grid{gap:8px}
    .title{font-size:26px}
  }
</style>
</head>
<body>
<main class="page">
  <section class="top">
    <h1 class="title">FREE REWARDS</h1>
    <p class="subtitle">Select your rewards</p>
    <div class="counter"><span id="count">0</span> rewards selected</div>
  </section>

  <section class="grid" id="rewardGrid">
    <!-- Replace these nine files with your own images.
         Keep the filenames image1, image2 ... image9. -->
    <div class="reward"><img src="image1.png" alt="Reward 1"></div>
    <div class="reward"><img src="image2.png" alt="Reward 2"></div>
    <div class="reward"><img src="image3.png" alt="Reward 3"></div>
    <div class="reward"><img src="image4.png" alt="Reward 4"></div>
    <div class="reward"><img src="image5.png" alt="Reward 5"></div>
    <div class="reward"><img src="image6.png" alt="Reward 6"></div>
    <div class="reward"><img src="image7.png" alt="Reward 7"></div>
    <div class="reward"><img src="image8.png" alt="Reward 8"></div>
    <div class="reward"><img src="image9.png" alt="Reward 9"></div>
  </section>

  <button class="claim" id="claim">Continue</button>
  <p class="hint">Tap any reward to select or unselect it.</p>
</main>

<div class="celebration" id="celebration">
  <div class="popup">
    <div class="check">✓</div>
    <h2>Congratulations!</h2>
    <p>Your rewards will be sent to you in 24 hours.</p>
  </div>
</div>

<script>
  const cards = document.querySelectorAll('.reward');
  const count = document.getElementById('count');

  function updateCount(){
    count.textContent = document.querySelectorAll('.reward.selected').length;
  }

  cards.forEach(card => {
    card.addEventListener('click', () => {
      card.classList.toggle('selected');
      updateCount();
    });
  });

  const celebration = document.getElementById('celebration');

  document.getElementById('claim').addEventListener('click', () => {
    const selected = document.querySelectorAll('.reward.selected').length;
    if (!selected) {
      alert('Please select at least one reward.');
      return;
    }

    celebration.classList.add('show');

    // Short burst of falling gift emojis.
    for (let i = 0; i < 28; i++) {
      const gift = document.createElement('div');
      gift.className = 'gift';
      gift.textContent = '🎁';
      gift.style.left = (Math.random() * 100) + 'vw';
      gift.style.animationDelay = (Math.random() * 0.55) + 's';
      gift.style.fontSize = (28 + Math.random() * 22) + 'px';
      document.body.appendChild(gift);
      setTimeout(() => gift.remove(), 4300);
    }

    // Keep the result screen visible after the gifts disappear.
    setTimeout(() => celebration.classList.remove('show'), 5000);
  });
</script>
</body>
</html>
